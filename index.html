<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des interventions</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="src/equipements.js" defer></script>
</head>
<body>
    <header>
        <h1>Gestion des interventions</h1>
        <p>Suivi des interventions techniques</p>
    </header>
    <main>
        <section>
            <h2>Équipements</h2>
            <form id="form-equipement">
                <label for="equipement-nom">Nom</label>
                <input id="equipement-nom" type="text" required>
                <label for="equipement-reference">Référence</label>
                <input id="equipement-reference" type="text" required>
                <label for="equipement-type">Type</label>
                <input id="equipement-type" type="text">
                <button type="submit">Ajouter l'équipement</button>
            </form>
            <ul id="liste-equipements"></ul>
        </section>
        <section>
            <h2>Nouvelle intervention</h2>
            <form id="form-intervention">
                <label for="equipement">Equipement</label>
                <input id="equipement" type="text" required>
                <label for="technicien">Technicien</label>
                <input id="technicien" type="text" required>
                <label for="date">Date</label>
                <input id="date" type="date" required>
                <button type="submit">Ajouter</button>
            </form>
        </section>
        <section>
            <h2>Interventions enregistrees</h2>
            <ul id="liste-interventions"></ul>
        </section>
    </main>
    <script src="src/app.js"></script>
</body>
</html>
